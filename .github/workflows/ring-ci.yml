name: ring-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ring-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate repository links
        run: python tools/check_markdown_links.py
      - name: Run Ring host tests when firmware exists
        shell: bash
        run: |
          if [[ -f ring/flow-ring/CMakeLists.txt ]]; then
            test -x ring/flow-ring/tests/host/run.sh
            ring/flow-ring/tests/host/run.sh
          else
            echo "Ring is documentation-only; firmware host-test gate is not active yet."
          fi
