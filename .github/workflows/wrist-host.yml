name: wrist-host

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: wrist-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore locked ESP-IDF components
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: wrist/flow-wrist
          command: idf.py reconfigure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run host C tests
        working-directory: wrist/flow-wrist
        run: CC=cc ./tests/host/run.sh
      - name: Run Hub mock tests
        working-directory: wrist/flow-wrist
        run: python tests/host/test_hub_mock.py
      - name: Run dancer asset tests
        working-directory: wrist/flow-wrist
        run: python tests/host/test_dancer_assets.py
