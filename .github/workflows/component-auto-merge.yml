name: component-auto-merge

on:
  workflow_run:
    workflows:
      - "component-boundary"
      - "contracts"
      - "wrist-host"
      - "ring-ci"
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge eligible component pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/auto_merge_component_pr.py
