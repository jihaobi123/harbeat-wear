name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_markdown_links.py
      - run: python tools/validate_contracts.py
      - run: python -m pytest tests wrist/flow-wrist/tests/host/test_contract_vectors.py -q
